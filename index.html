
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="CEO Tech Solutions provides website development, digital design, and technology solutions for businesses.">

<meta name="theme-color" content="#0b1f3a">

<title>CEO Tech Solutions | Build Your Digital Future</title>

<style>
* {
box-sizing: border-box;
}

html {
scroll-behavior: smooth;
scroll-padding-top: 20px;
}

body {
margin: 0;
font-family: Arial, Helvetica, sans-serif;
background-color: #f5f7fb;
color: #202938;
line-height: 1.7;
}

a {
transition: 0.2s ease;
}

.container {
width: 90%;
max-width: 1150px;
margin: auto;
}

/* NAVIGATION */

nav {
background-color: #0b1f3a;
padding: 18px 0;
}

.nav-container {
display: flex;
justify-content: space-between;
align-items: center;
gap: 20px;
flex-wrap: wrap;
}

.logo {
color: white;
font-size: 23px;
font-weight: bold;
text-decoration: none;
}

.nav-links {
display: flex;
flex-wrap: wrap;
gap: 18px;
}

.nav-links a {
color: white;
text-decoration: none;
font-size: 14px;
font-weight: bold;
}

.nav-links a:hover {
color: #60a5fa;
}

/* BUTTONS */

.button {
display: inline-block;
padding: 13px 23px;
border-radius: 7px;
background-color: #1473e6;
color: white;
text-decoration: none;
font-weight: bold;
border: none;
cursor: pointer;
margin: 7px 5px 7px 0;
}

.button:hover {
background-color: #0958b8;
transform: translateY(-2px);
}

.button-light {
background-color: white;
color: #0b1f3a;
}

.button-light:hover {
background-color: #e7efff;
}

.button-whatsapp {
background-color: #168b53;
}

.button-whatsapp:hover {
background-color: #106b3f;
}

/* HERO / HOME */

#home {
background: linear-gradient(135deg, #0b1f3a, #164e8a);
color: white;
padding: 100px 0;
}

.hero-content {
max-width: 780px;
text-align: center;
margin: auto;
}

.eyebrow {
color: #93c5fd;
font-weight: bold;
letter-spacing: 2px;
text-transform: uppercase;
font-size: 13px;
}

#home h1 {
font-size: 48px;
line-height: 1.2;
margin: 20px 0;
}

#home p {
font-size: 18px;
color: #e5edf8;
max-width: 650px;
margin: 15px auto;
}

/* GENERAL SECTIONS */

section {
padding: 75px 0;
}

.section-heading {
text-align: center;
max-width: 720px;
margin: 0 auto 38px;
}

.section-heading h2 {
color: #1473e6;
font-size: 34px;
line-height: 1.3;
margin-bottom: 12px;
}

.section-heading p {
color: #586579;
}

/* ABOUT */

#about {
background-color: white;
}

.about-content {
max-width: 850px;
margin: auto;
text-align: center;
}

.about-content p {
color: #4b5563;
}

/* SERVICES */

.service-container {
display: grid;
grid-template-columns: repeat(3, minmax(0, 1fr));
gap: 25px;
}

.service-card {
background-color: white;
padding: 30px 25px;
border-radius: 13px;
box-shadow: 0 5px 20px rgba(11, 31, 58, 0.07);
border: 1px solid #e8edf5;
transition: transform 0.2s;
}

.service-card:hover {
transform: translateY(-5px);
}

.service-number {
display: inline-block;
background-color: #e5efff;
color: #1473e6;
padding: 8px 13px;
border-radius: 8px;
font-weight: bold;
}

.service-card h3 {
color: #0b1f3a;
font-size: 21px;
margin-top: 18px;
}

.service-card p {
color: #586579;
}

/* PORTFOLIO */

#portfolio {
background-color: white;
}

.portfolio-grid {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 25px;
}

.portfolio-card {
background-color: #f5f7fb;
border-radius: 13px;
padding: 30px;
border: 1px solid #e2e8f0;
}

.portfolio-label {
display: inline-block;
color: #1473e6;
background-color: #e5efff;
padding: 5px 11px;
border-radius: 20px;
font-size: 12px;
font-weight: bold;
}

.portfolio-card h3 {
color: #0b1f3a;
margin-bottom: 8px;
}

.portfolio-card p {
color: #586579;
}

/* HOW IT WORKS */

.process-grid {
display: grid;
grid-template-columns: repeat(3, minmax(0, 1fr));
gap: 25px;
}

.process-card {
text-align: center;
padding: 25px;
background-color: white;
border-radius: 12px;
border: 1px solid #e8edf5;
}

.process-card h3 {
color: #1473e6;
}

.process-card p {
color: #586579;
}

/* CONTACT */

#contact {
background-color: #e8f1fc;
}

.contact-box {
max-width: 800px;
margin: auto;
text-align: center;
background-color: white;
padding: 40px 25px;
border-radius: 15px;
box-shadow: 0 5px 20px rgba(11, 31, 58, 0.06);
}

.contact-box p {
color: #586579;
}

.contact-details {
margin: 25px 0;
}

.contact-details a {
display: block;
color: #1473e6;
text-decoration: none;
font-weight: bold;
margin: 12px 0;
overflow-wrap: anywhere;
}

/* FOOTER */

footer {
background-color: #0b1f3a;
color: white;
padding: 30px 15px;
text-align: center;
}

footer p {
margin: 6px 0;
}

footer a {
color: #93c5fd;
text-decoration: none;
}

.footer-small {
color: #cbd5e1;
font-size: 13px;
margin-top: 15px;
}

/* TABLET AND PHONE */

@media (max-width: 800px) {
.service-container,
.process-grid {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

#home h1 {
font-size: 40px;
}
}

@media (max-width: 600px) {
.nav-container {
justify-content: center;
text-align: center;
}

.nav-links {
justify-content: center;
gap: 12px;
}

.logo {
font-size: 21px;
}

#home {
padding: 70px 0;
}

#home h1 {
font-size: 34px;
}

#home p {
font-size: 16px;
}

section {
padding: 55px 0;
}

.section-heading h2 {
font-size: 28px;
}

.service-container,
.portfolio-grid,
.process-grid {
grid-template-columns: 1fr;
}

.service-card,
.portfolio-card,
.process-card {
padding: 25px 20px;
}

.contact-box {
padding: 30px 18px;
}
}
</style>
</body>
</html>
